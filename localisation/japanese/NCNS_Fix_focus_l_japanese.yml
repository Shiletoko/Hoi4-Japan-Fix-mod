l_japanese:
 JAP_konoes_premiership: "近衛首相の続投"
 JAP_konoes_premiership_desc: "日中戦争における戦争指導を評価され、近衛首相の人気は頂点に達した！手にした絶大な権力をもって、彼は軍部に対する政府の優越性を確保するだろう。"
 JAP_Expand_PMs_powers: "首相権限の拡大"
 JAP_Expand_PMs_powers_desc: "大日本帝国において国務大臣は天皇が直接任命するものだった為、首相は直接閣僚を罷免する権限がなかった。このことは閣内不一致による総辞職を頻発させることに繋がり、国政の混乱を招くことになった。また二・二六事件五に復活した陸軍大臣現役武官制も内閣の脆弱性を助長している。これらの問題を是正することで、首相がより強力なリーダーシップを発揮できることだろう。"
 JAP_personality_cult: "個人崇拝"
 JAP_personality_cult_desc: "一党独裁制国家を構築するにあたり、首相個人の人気というものは重視されるべきものだ。近衛首相が手本とするヒトラーに倣い、個人崇拝を加速させていくべきだろう。"
 JAP_IRAA_form_party: "大政翼賛会を単一政党へ"
 JAP_IRAA_form_party_desc: "大政翼賛会は元々一党独裁で日本を支配することを目的としていたが、明治時代以前の幕府を想起させるという批判や、憲法に反するという批判を受け、一度は挫折してしまった。しかし近衛首相の人気が高まる中で我々は一党独裁を強行する好機を得た。議会でのすさまじい反対が予測されるが、今なら大政翼賛会をあるべき姿へと変えられるのかもしれない。"
 JAP_shinano_class: "航空母艦・信濃"
 JAP_shinano_class_desc: "航空技術が発達するにつれ、艦載機は今や水上艦を一撃で沈没させることが出来ると明らかになった。その為我々は建造途中の大型戦艦・信濃を装甲空母に改装し、制空権を確固たるものにしなければならない。"
 JAP_conversion_merchant_ship: "改装空母"
 JAP_conversion_merchant_ship_desc: "我が海軍は仮想敵国である英米に対し、造船力や軍量で劣っている。その為民間の商船建造に補助金を出し援助する代わりに、戦時の際はその船を徴用して空母として改装するべきだ。"
l_japanese:
 ### tooltips
 Konoe_Remain_tooltip: "§Hもし中国との戦争が120日以内に終われば、近衛首相の人気はさらに高まるだろう！§!"
 New_focuses_tooltip: "§H新たなナショナルフォーカスが解禁される！§!"
 
 SEA_japan_foreign_policy_Fixes.1.t: "日本が我々の条件付き降伏を要求"
 SEA_japan_foreign_policy_Fixes.1.d: "本日、[FROM.GetAdjective]の外交官が最後通牒を突きつけてきた。その内容は、アジア・太平洋地域からの撤退と、条件付き和平への署名を求めるものである。これはつまり、アジアから手を引けということだ。これによって我々はヨーロッパの領土奪還に完全に集中することができ、すべての敵を倒した後に太平洋地域奪還のために戻ってくれば良いのかもしれない。"
 SEA_japan_foreign_policy_Fixes.1.a: "我々は絶対に降伏しない！"
 SEA_japan_foreign_policy_Fixes.1.b: "これで敵が一つ減ることになるな"
 SEA_japan_foreign_policy_Fixes.2.t: "[FROM.GetNameDefCap]が降伏を拒否"
 SEA_japan_foreign_policy_Fixes.2.desc: "愚かな[FROM.GetFactionName]は我々の当初の要求を拒否した。これにより、彼らの陣営を完全に壊滅させなければならない。"
 SEA_japan_foreign_policy_Fixes.2.a: "奴らめ、刀の錆にしてくれるわ！"
 SEA_japan_foreign_policy_Fixes.3.t: "[FROM.GetNameDefCap]が領土を明け渡す"
 SEA_japan_foreign_policy_Fixes.3.desc: "[FROM.GetLeader]は外交官を通じて尻尾を巻いて降伏した。我々の要求を受け入れ、大東亜の領土は我々に明け渡す予定だ。今日は帝国にとって素晴らしい日だ！"
 SEA_japan_foreign_policy_Fixes.3.a: "今日は我々の勝利だ！"
 SEA_japan_foreign_policy_Fixes.4.t: "近衛首相の国民人気が急激に高まる"
 SEA_japan_foreign_policy_Fixes.4.desc: "日中戦争での輝かしい勝利を受け、戦争指導を行った近衛首相の国民人気は極限まで高まった。彼の権威はかつての藤原氏や豊臣氏をも凌駕しており、人々は畏怖と敬愛を込めて彼を『今関白』と呼んでいる。その為、今の所は軍部もおいそれと彼を倒閣することはできないだろう。"
 SEA_japan_foreign_policy_Fixes.4.a: "『今関白』に万歳！"
 SEA_japan_foreign_policy_Fixes.5.t: "議会が内閣不信任案を提出！"
 SEA_japan_foreign_policy_Fixes.5.desc: "近衛首相はついに大政翼賛会を政党とすることに成功した。しかし、急進的な改革は国民の間に不安を広げ、議会政治の終焉を危惧する声が次第に高まり、議会では、近衛内閣が国民的人気を盾に専制政治へ突き進んでいるとの批判が噴出した。やがて反対派議員たちは結束し、「一党独裁と化した近衛内閣を打倒する」として内閣不信任案を提出するに至った。"
 SEA_japan_foreign_policy_Fixes.5.a: "内閣不信任案は否決された！近衛総理大臣に万歳！"
 SEA_japan_foreign_policy_Fixes.5.b: "内閣不信任案は可決され、近衛内閣は総辞職した！"
 SEA_japan_foreign_policy_Fixes.6.t: "後継首相の選出"
 SEA_japan_foreign_policy_Fixes.6.desc: "近衛内閣の辞職後、重臣会議が開かれ、後継首相を選定する会議が開かれた。会議では様々な案が出されていたが、陸海軍を抑えうる政治的基盤を持ち、かつ議会と世論をなだめることが出来る人物が必要とされていることで一致した。幸いにも、近衛首相の行った改革のおかげで首相の権力が強化されている為、内閣が成立さえすれば陸海軍が倒閣することは難しい。そのような条件の中選ばれたのは..."
 SEA_japan_foreign_policy_Fixes.6.a: "日本自由党の鳩山一郎が適任だろう"
 SEA_japan_foreign_policy_Fixes.6.b: "日本進歩党の町田忠治が適任だろう"
 SEA_japan_foreign_policy_Fixes.6.c: "既成政党から支持を受けている宇垣一成が適任だろう"
 SEA_japan_foreign_policy_Fixes.6.d: "旧民政党系の町田忠治が適任だろう"
 SEA_japan_foreign_policy_Fixes.7.t: "日本自由党の結成"
 SEA_japan_foreign_policy_Fixes.7.desc: "近衛内閣が崩壊する中で、新たな政局の中で主導権を握るべく議員たちが動き出した。かつての立憲政友会に所属し、大政翼賛会に批判的であったグループは鳩山一郎を中心として日本自由党を結成した。"
 SEA_japan_foreign_policy_Fixes.7.a: "了解"
 SEA_japan_foreign_policy_Fixes.8.t: "日本進歩党の結成"
 SEA_japan_foreign_policy_Fixes.8.desc: "近衛内閣が崩壊する中で、新たな政局の中で主導権を握るべく議員たちが動き出した。かつての立憲民政党に所属していたグループは町田忠治を中心として日本進歩党を結成した。"
 SEA_japan_foreign_policy_Fixes.8.a: "了解"
 SEA_japan_foreign_policy_Fixes.9.t: "ぶら志゛る丸が撃沈される"
 SEA_japan_foreign_policy_Fixes.9.desc: "[GetDate]、ぶら志゛る丸が敵国海軍によって沈没させられた。ぶら志゛る丸は便乗者240名を乗せてトラックを出港し、北水道を通過して横須賀へ向かっていたが、その途上で敵艦に二度襲撃された。一度目は襲撃を回避することが出来たものの、二度目の襲撃にて敵の攻撃がぶら志゛る丸に命中すると機関室が使用不能となって左舷へ傾斜。やがて船首が45度の角度で持ち上がりはじめ、ぶら志゛る丸は海中に没した。沈没の直前、大野仁助船長がブリッジに立って三度「天皇陛下万歳」を高唱して万歳をしたと報告されている。これによって大野仁助船長以下乗組員57名と兵員等131計188名が船と共に殉死した。"
 SEA_japan_foreign_policy_Fixes.9.a: "なんという悲劇だ！"
 SEA_japan_foreign_policy_Fixes.10.t: "上海での軍事衝突！"
 SEA_japan_foreign_policy_Fixes.10.desc: "日本と中国の間で武力衝突が発生して以降、日本政府は在中日本人をを上海に避難させていたが、その中で引き揚げ者保護にあたっていた海軍陸戦隊の大山勇夫中尉と兵士１名が中国保安隊によって射殺されるという事件が起こった。この事件をきっかけとして上海で戦闘が発生。戦争は中国大陸北部から全土に拡大していくことになった。"
 SEA_japan_foreign_policy_Fixes.10.a: "事変の収束は見込めるのか...？"